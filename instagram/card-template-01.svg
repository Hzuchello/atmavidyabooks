<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500&display=swap');

      .bg { fill: #F0EBE0; }
      .moldura { fill: none; stroke: #C9782F; stroke-width: 1.5; }
      .eyebrow { font-family: 'Outfit', sans-serif; font-size: 22px; letter-spacing: 4px; fill: #C9782F; font-weight: 500; }
      .devanagari { font-family: 'Cormorant Garamond', serif; font-size: 46px; fill: #1B1F3B; }
      .iast { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 30px; fill: #6B6560; }
      .traducao { font-family: 'Playfair Display', serif; font-size: 44px; fill: #1B1F3B; font-weight: 500; }
      .comentario { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 28px; fill: #2C2A26; }
      .marca-nome { font-family: 'Playfair Display', serif; font-size: 26px; fill: #1B1F3B; font-weight: 600; }
      .marca-handle { font-family: 'Outfit', sans-serif; font-size: 18px; fill: #6B6560; letter-spacing: 1px; }
      .linha { stroke: #D9D2C4; stroke-width: 1; }
    </style>
  </defs>

  <!-- fundo -->
  <rect class="bg" width="1080" height="1080" />
  <rect class="moldura" x="48" y="48" width="984" height="984" />

  <!-- eyebrow -->
  <text x="540" y="140" text-anchor="middle" class="eyebrow">YOGA SŪTRAS · SABEDORIA QUE TRANSFORMA</text>

  <!-- devanagari (placeholder — troque pelo verso real) -->
  <text x="540" y="260" text-anchor="middle" class="devanagari">योगश्चित्तवृत्तिनिरोधः</text>

  <!-- IAST (placeholder) -->
  <text x="540" y="310" text-anchor="middle" class="iast">yogaś-citta-vṛtti-nirodhaḥ · I.2</text>

  <line class="linha" x1="440" y1="360" x2="640" y2="360" />

  <!-- tradução (placeholder — troque pela tradução de vocês) -->
  <text x="540" y="450" text-anchor="middle" class="traducao">
    <tspan x="540" dy="0">"Yoga é a cessação</tspan>
    <tspan x="540" dy="56">das flutuações da mente."</tspan>
  </text>

  <!-- comentário (placeholder — troque pelo comentário autoral de vocês) -->
  <text x="540" y="610" text-anchor="middle" class="comentario">
    <tspan x="540" dy="0">[Espaço para o comentário autoral —</tspan>
    <tspan x="540" dy="40">2 a 4 linhas, tom reflexivo, sem</tspan>
    <tspan x="540" dy="40">invencionice, conectando com a</tspan>
    <tspan x="540" dy="40">experiência do buscador.]</tspan>
  </text>

  <!-- rodapé / marca -->
  <text x="540" y="960" text-anchor="middle" class="marca-nome">Ātma Vidyā</text>
  <text x="540" y="992" text-anchor="middle" class="marca-handle">@SEU_USUARIO_AQUI</text>
</svg>
