<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500&display=swap');

      .bg { fill: #F0EBE0; }
      .moldura { fill: none; stroke: #C9782F; stroke-width: 1.5; }
      .eyebrow { font-family: 'Outfit', sans-serif; font-size: 20px; letter-spacing: 3px; fill: #C9782F; font-weight: 500; }
      .comentario { font-family: 'Cormorant Garamond', serif; font-size: 32px; fill: #2C2A26; }
      .marca-nome { font-family: 'Playfair Display', serif; font-size: 26px; fill: #1B1F3B; font-weight: 600; }
      .marca-handle { font-family: 'Outfit', sans-serif; font-size: 18px; fill: #6B6560; letter-spacing: 1px; }
      .pagina { font-family: 'Outfit', sans-serif; font-size: 16px; fill: #6B6560; letter-spacing: 1px; }
    </style>
  </defs>

  <rect class="bg" width="1080" height="1080" />
  <rect class="moldura" x="48" y="48" width="984" height="984" />

  <text x="540" y="160" text-anchor="middle" class="eyebrow">COMENTÁRIO · DRAṢṬU</text>

  <text x="540" y="360" text-anchor="middle" class="comentario">
    <tspan x="540" dy="0">Drashtu — "o observador" —</tspan>
    <tspan x="540" dy="44">é o Púrusha do Sámkhya, a</tspan>
    <tspan x="540" dy="44">consciência pura que</tspan>
    <tspan x="540" dy="44">testemunha tudo sem se</tspan>
    <tspan x="540" dy="44">misturar com nada. Não cria,</tspan>
    <tspan x="540" dy="44">não age, não sofre,</tspan>
    <tspan x="540" dy="44">apenas observa.</tspan>
  </text>

  <text x="540" y="960" text-anchor="middle" class="marca-nome">Ātma Vidyā</text>
  <text x="540" y="992" text-anchor="middle" class="marca-handle">@SEU_USUARIO_AQUI</text>
  <text x="1000" y="1000" text-anchor="end" class="pagina">3/5</text>
</svg>
